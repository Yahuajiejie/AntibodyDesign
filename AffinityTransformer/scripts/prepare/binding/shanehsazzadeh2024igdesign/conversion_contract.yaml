study_id: shanehsazzadeh2024igdesign
paper: "Shanehsazzadeh et al., bioRxiv 2023.12.08.570889 (2024); AbSci IgDesign"
antibody: "therapeutic reference mAb + IgDesign HCDR designs (IgG)"
label_kind: experimental          # source: paper (SPR K_D)
common_rules:
  row_expansion: "one record per raw row (Positive Control + designed variants)"  # source: repository_convention
  antibody_fields:
    heavy_chain: "raw 'heavy' (VH)"; light_chain: "raw 'light' (VL)"; antibody_type: IgG  # source: raw + paper
  metric_name: neg_log10_kd_M
  metric_unit: "-log10(KD/M)"
  metric_direction: higher_is_better                 # source: deterministic_transformation
  rank_label_rule: "rank_label = -log10(fitness * 1e-9); fitness = K_D in nM"  # source: paper (nM) + deterministic_transformation
  antigen_source: retrieved                          # source: official_database (target verified; construct per UniProt note)
  group_id_rule: "shanehsazzadeh2024igdesign/<table_id>/<antigen_key>/neg_log10_kd_M/experimental"  # source: repository_convention
  missing_value_handling: "null light allowed; non-finite -log10 -> rank_label null"
  keep_for_training: "true unless heavy missing/invalid OR rank_label non-finite"
  drop_reason: "missing_or_invalid_heavy_chain | missing_rank_label"

